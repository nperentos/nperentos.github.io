  highlight: 0

- title: "An EEG investigation of sleep homeostasis in healthy and CLN5 Batten disease affected sheep"
  image: SleepHomeostasisSheep.png
  description: This study explores sleep homeostasis in both healthy sheep and those affected by CLN5 Batten disease using EEG. The research provides insights into how sleep patterns differ between healthy and diseased animals.
  authors: N. Perentos, A. Q. Martins, R. J. Cumming, N. L. Mitchell, D. N. Palmer, S. J. Sawiak, A. J. Morton
  link:
    url: https://www.jneurosci.org/content/36/31/8238
    display: The Journal of Neuroscience, 36(31), 8238–8249
  highlight: 0

- title: "Automated detection and characterisation of rumination in sheep using in vivo electrophysiology"
  image: SheepRumination.png
  description: This study presents an automated method for detecting and characterizing rumination in sheep using in vivo electrophysiology. The research aims to improve understanding of digestive processes in sheep through advanced monitoring techniques.
  authors: A. U. Nicol, N. Perentos, A. Q. Martins, A. J. Morton
  link:
    url: https://doi.org/10.1016/j.physbeh.2016.05.028
