  highlight: 0

- title: "A mobile, high-throughput semi-automated system for testing cognition in large non-primate animal models of Huntington disease"
  image: HuntingtonCognition.png
  description: This study introduces a mobile, high-throughput semi-automated system for assessing cognition in large non-primate animal models of Huntington's disease. The system aims to improve efficiency and accuracy in cognitive testing.
