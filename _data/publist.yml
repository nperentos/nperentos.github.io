- title: "Multi-shank 1024 channels active SiNAPS probe for large multi-regional topographical electrophysiological mapping of neural dynamics"
  image: sinaps.jpg
  description: This study introduces a novel multi-shank SiNAPS probe capable of large-scale electrophysiological mapping across multiple brain regions. The probe features 1024 channels, enabling detailed neural dynamics analysis in awake, behaving subjects.
  authors: G N. Angotzi, M Vöröslakos, N Perentos, J. F. Ribeiro, M. Vincenzi, F. Boi, A. Lecomte, G. Orbán, A. Genewsky, G. Schwesig, D. Aykan, G. Buzsáki, A. Sirota, L. Berdondini
  link:
    url: https://onlinelibrary.wiley.com/doi/abs/10.1002/advs.202416239
    display: Advanced Science, e2416239 (Advance online publication)
  highlight: 1

- title: "Key roles of C2/GAP domains in SYNGAP1-related pathophysiology"
  image: SYNGAP1Pathophysiology.png
  description: This study explores the critical roles of C2/GAP domains in the pathophysiology associated with SYNGAP1, a gene linked to intellectual disability and other neurological disorders. The research sheds light on how these domains contribute to the underlying mechanisms.
  authors: D. Katsanevaki, S. M. Till, I. Buller-Peralta, M. S. Nawaz, S. R. Louros, V. Kapgal, S. Tiwari, D. Walsh, N. J. Anstey, N. G. Petrović, A. Cormack, V. Salazar-Sanchez, A. Harris, W. Farnworth-Rowson, A. Sutherland, T. C. Watson, S. Dimitrov, A. D. Jackson, D. Arkell, S. Biswal, … P. C. Kind
  link:
