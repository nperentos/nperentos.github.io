  highlight: 0

- title: "Deep brain electrophysiology in freely moving sheep"
  image: sheep_su.jpg
  description: This study explores deep brain electrophysiology in freely moving sheep, providing insights into neural activity in a naturalistic setting. The research offers a unique perspective on brain function in a large animal model.
  authors: N. Perentos, M. Krstulovic, A. J. Morton
  link:
    url: https://www.sciencedirect.com/science/article/pii/S096098222101722X
    display: Current Biology, 32(4), 763–774.e4
  highlight: 1

- title: "Techniques for chronic monitoring of brain activity in freely moving sheep using wireless EEG recording"
  image: SheepWirelessEEG.png
  description: This study presents techniques for chronic monitoring of brain activity in freely moving sheep using wireless EEG recording. The research focuses on developing methods for long-term neural activity monitoring in a naturalistic setting.
  authors: N. Perentos, A. U. Nicol, A. Q. Martins, J. E. Stewart, P. Taylor, A. J. Morton
  link:
    url: https://doi.org/10.1016/j.jneumeth.2016.11.010
